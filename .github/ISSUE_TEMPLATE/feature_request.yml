name: Feature request
description: Propose new content, a new section, or an improvement to an existing surface.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should exist that doesn't, or what should change?
      placeholder: "Add a /talks page listing recorded talks with embedded video and a transcript link per entry."
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - New page / section
        - Existing page improvement
        - SEO / schema
        - Performance / DX
        - Other
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why
      description: What problem does this solve, or what does it enable?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the same problem you ruled out.
    validations:
      required: false
