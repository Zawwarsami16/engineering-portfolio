name: Import verified W1 manuscript
on:
  push:
    paths:
      - ".github/workflows/import-w1-pdf.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-w1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch author-verified W1 PDF from the published research tree
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request
          source = "https://raw.githubusercontent.com/Zawwarsami16/Public-Research-Tree/main/W/W1/Zawwar-Sami-Weapons-as-Systems-W1.pdf"
          expected = "cadd4f05d3217ae032f0f0baa6aae6beae491237b2b5f39edb74e5f66d4a18a0"
          req = urllib.request.Request(source, headers={"User-Agent": "W1-Verified-Research-Archive/1.0", "Accept": "*/*"})
          with urllib.request.urlopen(req, timeout=30) as response:
              data = response.read()
          digest = hashlib.sha256(data).hexdigest()
          if digest != expected:
              raise RuntimeError("Wrong W1 source PDF checksum; refusing to publish: " + digest)
          target = pathlib.Path("public/papers/Zawwar-Sami-W1-Weapons-as-Systems-v1.0.pdf")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(data)
          print("Verified W1 original PDF",target,len(data),digest)
          PY
      - name: Commit only the exact original manuscript
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/papers/Zawwar-Sami-W1-Weapons-as-Systems-v1.0.pdf
          if git diff --cached --quiet; then echo "Identical W1 PDF already present"; exit 0; fi
          git commit -m "Archive verified original W1 PDF for static website access"
          git push
